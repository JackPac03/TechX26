# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Local installs may record Westpac's internal registry, which GitHub can't reach; use the public one.
      - run: sed -i 's#https://artifactory.srv.westpac.com.au/artifactory/api/npm/wdp-001_npm_virtual/#https://registry.npmjs.org/#g' package-lock.json
      - run: npm ci
      # Pages serves the site from /<repo name>/. The live leaderboard stays off until both repository variables are set.
      # TRUSTED_NETWORKS limits the site to those networks; the build only publishes fingerprints of them.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          TRUSTED_NETWORKS: ${{ secrets.TRUSTED_NETWORKS }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Pages has no rewrites, so booth and secret QR links (/exhibits/…, /secret/…) fall back to the app via 404.html.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
